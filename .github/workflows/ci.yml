name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 2.0.0). Leave empty to use package.json version.'
        required: false
        type: string

env:
  NODE_VERSION: '22'

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run unit tests
        run: npm run test:unit -- --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          NODE_ENV: test

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arc_badminton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate:prod
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arc_badminton_test

      - name: Run integration tests
        run: npm run test:integration -- --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arc_badminton_test

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: coverage/
          retention-days: 7

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run security tests
        run: npm run test:security
        env:
          NODE_ENV: test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: smatch-badminton
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit info
        id: commit
        run: |
          echo "SHA=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "Deploying commit: ${GITHUB_SHA:0:7}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify build artifacts
        run: |
          echo "=== Build artifacts downloaded ==="
          ls -lah dist/
          echo ""
          echo "=== Package version ==="
          cat package.json | grep '"version"'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create version file
        run: |
          cat > version.json << EOF
          {
            "version": "$(node -p "require('./package.json').version")",
            "commit": "${{ steps.commit.outputs.SHA }}",
            "commitShort": "${{ steps.commit.outputs.SHORT_SHA }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref_name }}"
          }
          EOF
          cat version.json

      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz dist/ package.json package-lock.json prisma/ version.json
          echo "=== Deployment package contents ==="
          tar -tzf deploy.tar.gz | head -20

      - name: Copy to EC2
        run: scp deploy.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "Deploying version: $(cat $GITHUB_OUTPUT | grep VERSION | cut -d= -f2)"

      - name: Deploy and restart PM2
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "bash -s" << ENDSSH
            set -e
            APP_DIR=/home/ubuntu/arc_badminton
            APP_NAME="arc-badminton"
            VERSION="$APP_VERSION"
            
            cd \$APP_DIR
            
            # Show current state
            echo "=== Current deployment info ==="
            if [ -f version.json ]; then
              cat version.json
            else
              echo "No version.json found (first deployment?)"
            fi
            echo ""
            
            # Remove old dist and node_modules to ensure clean deployment
            echo "Removing old dist folder and node_modules..."
            rm -rf dist/ node_modules/
            
            # Extract new deployment
            echo "Extracting new deployment package..."
            tar -xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz
            
            # Write .env from secret
            echo "Writing environment variables..."
            cat > .env << 'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF
            
            # Install production dependencies only
            echo "Installing production dependencies..."
            npm ci --omit=dev
            
            # Generate Prisma client
            echo "Generating Prisma client..."
            npx prisma generate
            
            # Backup database before migration (optional but recommended)
            echo "Checking migration status..."
            npx prisma migrate status || true
            
            # Run database migrations (non-destructive, preserves data)
            echo "Deploying migrations..."
            npx prisma migrate deploy
            
            # Stop old PM2 processes gracefully
            echo "Stopping old PM2 processes..."
            pm2 stop all 2>/dev/null || true
            pm2 delete all 2>/dev/null || true
            
            # Start new process with version name
            echo "Starting new PM2 process..."
            pm2 start dist/index.js --name "\${APP_NAME}-v\${VERSION}" --update-env
            
            echo "Deployed version: \$VERSION"
            pm2 list
            
            # Save PM2 process list
            pm2 save
            
            # Force restart to ensure new code is loaded
            echo "Restarting to ensure new code is loaded..."
            pm2 restart "\${APP_NAME}-v\${VERSION}"
            
            # Show deployed version
            echo ""
            echo "=== Deployed version info ==="
            cat version.json
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 10
          echo "Performing health check..."
          curl -f --retry 5 --retry-delay 10 http://${{ secrets.EC2_HOST }}/health || echo "Health check endpoint not available"
          echo ""
          echo "Checking deployed version..."
          curl -s http://${{ secrets.EC2_HOST }}/version | jq '.' || echo "Version endpoint not available"
          
      - name: Verify deployment
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << ENDSSH
            cd /home/ubuntu/arc_badminton
            echo "=== Deployed Version ==="
            cat version.json
            echo ""
            echo "=== PM2 Process List ==="
            pm2 list
            echo ""
            echo "=== PM2 Logs (last 20 lines) ==="
            pm2 logs --lines 20 --nostream
            echo ""
            echo "=== Disk Usage ==="
            du -sh dist/ node_modules/ 2>/dev/null || true
          ENDSSH
          
          echo ""
          echo "✅ Deployment completed successfully!"
          echo "📦 Version: $(cat version.json | grep '\"version\"' | cut -d'"' -f4 || echo 'unknown')"
          echo "🔖 Commit: ${{ steps.commit.outputs.SHORT_SHA }}"
