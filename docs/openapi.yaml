openapi: 3.1.0
info:
  title: Smatch Badminton Backend API
  description: |
    API for managing badminton court information, bookings, payments, and serving vector map tiles.
    
    ## Features
    - **Courts Management**: CRUD operations for badminton courts
    - **Search & Autocomplete**: Real-time search with Vietnamese support
    - **Availability**: Time slot availability with pricing
    - **Bookings**: Court reservation system
    - **Payments**: ZaloPay integration with real-time WebSocket notifications
    - **Map Tiles**: Vector tiles for interactive maps
    - **Exchange Matches**: Create and join badminton matches with other players
    
    ## Changelog
    ### v2.4.1 (2025-12-31)
    - **Expired Match Filtering**: Implemented query-time filtering for expired matches across all match endpoints
      - By default, all match queries return only non-expired (future) matches where `(date + end_time) > NOW()`
      - Added `includeExpired` query parameter to `GET /api/matches`, `GET /api/matches/hosted`, and `GET /api/matches/joined`
      - Use `includeExpired=true` to retrieve full match history including past/expired matches
      - Added PostgreSQL expression index `idx_matches_datetime_end` on `(date + end_time, status)` for optimal query performance
      - Timezone-aware filtering using Asia/Ho_Chi_Minh timezone
    
    ### v2.4.0 (2025-12-29)
    - **LocalStack S3 Integration**: Added LocalStack service for local S3 simulation
    - **Image Upload & Compression**: All images compressed with JPEG quality 80 before storage
    - **Profile Photo Upload**: Added `POST /api/auth/me/photo` endpoint for profile image upload (multipart/form-data, max 5MB)
    - **Google Login Auto-Population**: Automatically populates `username` from `displayName` and `photoUrl` from Google photo for new and existing users with empty fields
    - **Match Image Upload**: `POST /api/matches` now accepts multipart/form-data with up to 3 images (max 5MB each, JPEG/PNG/WebP)
    - **Match Filtering**: `GET /api/matches` now filters out matches the authenticated user has already joined
    - **Schedule Conflict Prevention**: Match join now prevents scheduling conflicts - users cannot join multiple matches with overlapping time ranges on the same day
    - **Backfill Script**: Added `npm run backfill:google-users` script to migrate existing Google users
    
    ### v2.3.0 (2025-12-27)
    - Added `POST /api/matches/{id}/payment` for ZaloPay match join payments
    - Added `GET /api/matches/{id}/payment/{paymentId}/status` for payment status query
    - Added `PENDING_PAYMENT` and `EXPIRED` to MatchPlayerStatus enum
    - Added `MATCH_JOIN` payment type
    - Fixed null-safety on host serialization in match responses
    - Updated error responses to include machine-readable `code` field
    - Aligned SkillLevel enum: TBY, Y, Y_PLUS, Y_PLUS_PLUS, TBK, TB, TB_PLUS, TB_PLUS_PLUS, K, K_PLUS, GIOI
    - Aligned PlayerFormat enum: SINGLE_MALE, SINGLE_FEMALE, DOUBLE_MALE, DOUBLE_FEMALE, MIXED_DOUBLE, ANY
  version: 2.4.1
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: User authentication and profile management (Firebase Auth)
  - name: Courts
    description: Court management operations
  - name: Search
    description: Search and autocomplete functionality
  - name: Availability
    description: Court availability and pricing
  - name: Bookings
    description: Booking management
  - name: Payments
    description: ZaloPay payment integration
  - name: Matches
    description: Exchange match creation and joining
  - name: Images
    description: Image access via S3 proxy
  - name: Map Tiles
    description: Vector map tiles
  - name: Admin
    description: Administrative operations

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the server is running
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                    example: '2025-11-25T12:00:00.000Z'

  # ==================== Auth Endpoints ====================

  /api/auth/verify:
    post:
      tags:
        - Auth
      summary: Verify Firebase token
      description: |
        Verify Firebase ID token and create/get user.
        Used for all login types: Google, Facebook, Email/Password.
        Creates a new user if not exists, otherwise returns existing user.
      operationId: verifyToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTokenRequest'
      responses:
        '200':
          description: User verified (existing user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '201':
          description: User created (new user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/anonymous:
    post:
      tags:
        - Auth
      summary: Create anonymous user
      description: |
        Create or get anonymous user session.
        Used for anonymous booking flow where users can book without registration.
      operationId: createAnonymous
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnonymousRequest'
      responses:
        '200':
          description: Anonymous user retrieved (existing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '201':
          description: Anonymous user created (new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/auth/convert:
    post:
      tags:
        - Auth
      summary: Convert anonymous to registered
      description: |
        Convert anonymous user to registered user.
        Requires authenticated anonymous user.
        All existing bookings will be preserved and linked to the new account.
      operationId: convertAnonymous
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertAnonymousRequest'
      responses:
        '200':
          description: User converted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResponse'
        '400':
          description: User is not anonymous or invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email or username already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      description: Get the authenticated user's profile information
      operationId: getProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Auth
      summary: Update user profile
      description: Update the authenticated user's profile information
      operationId: updateProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me/photo:
    post:
      tags:
        - Auth
      summary: Upload profile photo
      description: |
        Upload a profile photo for the authenticated user.
        
        **Image Requirements:**
        - Format: JPEG, PNG, or WebP
        - Max size: 5MB
        - Automatically compressed and resized to 500x500px
        - Stored in S3 with JPEG format (quality 85)
        
        The old profile photo will be automatically deleted if one exists.
      operationId: uploadProfilePhoto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: The profile image file to upload
      responses:
        '201':
          description: Profile photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
                      photoUrl:
                        type: string
                        format: uri
                        example: 'http://localhost:4566/smatch-profiles/users/123/profile/1234567890.jpg'
        '400':
          description: Invalid file or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                noFile:
                  value:
                    success: false
                    error:
                      message: No image file provided
                      code: NO_FILE_PROVIDED
                invalidType:
                  value:
                    success: false
                    error:
                      message: Invalid file type. Only image/jpeg, image/jpg, image/png, image/webp are allowed.
                      code: INVALID_FILE_TYPE
                tooLarge:
                  value:
                    success: false
                    error:
                      message: File too large. Maximum size is 5MB.
                      code: FILE_TOO_LARGE
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me/bookings:
    get:
      tags:
        - Auth
      summary: Get user's booking history
      description: |
        Get paginated booking history for the authenticated user.
        Works for both anonymous and registered users.
      operationId: getBookingHistory
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: status
          in: query
          description: Filter by booking status
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed]
      responses:
        '200':
          description: Booking history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHistoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/username/check:
    post:
      tags:
        - Auth
      summary: Check username availability
      description: Check if a username is available for registration
      operationId: checkUsername
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsernameRequest'
      responses:
        '200':
          description: Username availability status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailabilityResponse'
        '400':
          description: Invalid username format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/username/lookup:
    post:
      tags:
        - Auth
      summary: Lookup email by username
      description: |
        Get the email associated with a username.
        Used in the login flow when user enters username instead of email.
      operationId: lookupUsername
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupUsernameRequest'
      responses:
        '200':
          description: Email found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameLookupResponse'
        '404':
          description: Username not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/link-bookings:
    post:
      tags:
        - Auth
      summary: Link existing bookings
      description: |
        Link existing bookings made as guest to the authenticated user.
        Matches by phone number or email.
      operationId: linkBookings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkBookingsRequest'
      responses:
        '200':
          description: Bookings linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkBookingsResponse'
        '400':
          description: Phone number or email required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/account:
    delete:
      tags:
        - Auth
      summary: Delete user account
      description: |
        Delete the authenticated user's account.
        Requires a registered (non-anonymous) user.
        Existing bookings will have their user reference removed but won't be deleted.
      operationId: deleteAccount
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Anonymous users cannot delete accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Court Endpoints ====================

  /api/courts:
    get:
      tags:
        - Courts
      summary: List all courts
      description: Get paginated list of all courts with optional filtering
      operationId: listCourts
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 10
        - name: district
          in: query
          description: Filter by district name
          schema:
            type: string
      responses:
        '200':
          description: List of courts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtListResponse'

    post:
      tags:
        - Courts
      summary: Create a new court
      description: Create a new badminton court
      operationId: createCourt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourtRequest'
      responses:
        '201':
          description: Court created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtResponse'

  /api/courts/nearby:
    get:
      tags:
        - Courts
      summary: Find nearby courts
      description: Find courts within a specified radius from a location
      operationId: findNearbyCourts
      parameters:
        - name: latitude
          in: query
          required: true
          description: GPS latitude
          schema:
            type: number
            format: float
        - name: longitude
          in: query
          required: true
          description: GPS longitude
          schema:
            type: number
            format: float
        - name: radius
          in: query
          description: Search radius in km
          schema:
            type: number
            format: float
            default: 5
      responses:
        '200':
          description: List of nearby courts with distance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyCourtListResponse'

  /api/courts/{id}:
    get:
      tags:
        - Courts
      summary: Get court by ID
      description: Get a specific court by its UUID
      operationId: getCourtById
      parameters:
        - name: id
          in: path
          required: true
          description: Court UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Court details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtResponse'
        '404':
          description: Court not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Courts
      summary: Update a court
      description: Update an existing court
      operationId: updateCourt
      parameters:
        - name: id
          in: path
          required: true
          description: Court UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourtRequest'
      responses:
        '200':
          description: Court updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtResponse'
        '404':
          description: Court not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Courts
      summary: Delete a court
      description: Delete an existing court
      operationId: deleteCourt
      parameters:
        - name: id
          in: path
          required: true
          description: Court UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Court deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '404':
          description: Court not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/courts/{courtId}/availability:
    get:
      tags:
        - Availability
      summary: Get court availability
      description: Get availability for all sub-courts of a court on a specific date
      operationId: getCourtAvailability
      parameters:
        - name: courtId
          in: path
          required: true
          description: Court UUID
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Court availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '404':
          description: Court not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/search/autocomplete:
    get:
      tags:
        - Search
      summary: Autocomplete suggestions
      description: |
        Get real-time autocomplete suggestions from Redis.
        Supports Vietnamese diacritics - searches both accented and unaccented text.
        Example: "cau giay" will match "Cầu Giấy"
        
        Use `includeDetails=true` to include address and geolocation coordinates in the response.
      operationId: searchAutocomplete
      parameters:
        - name: q
          in: query
          required: true
          description: Search prefix (minimum 2 characters)
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum results
          schema:
            type: integer
            default: 10
            maximum: 20
        - name: includeDetails
          in: query
          description: Include address and geolocation in response
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
              examples:
                basic:
                  summary: Basic response (default)
                  value:
                    success: true
                    data:
                      suggestions:
                        - id: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                          text: "Sân Cầu Lông Ngọc Khánh"
                          score: 100
                withDetails:
                  summary: Response with details (includeDetails=true)
                  value:
                    success: true
                    data:
                      suggestions:
                        - id: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                          text: "Sân Cầu Lông Ngọc Khánh"
                          score: 100
                          address: "123 Ngọc Khánh, Phường Ngọc Khánh, Quận Ba Đình, Hà Nội"
                          latitude: 21.0285
                          longitude: 105.8542
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/search/courts:
    get:
      tags:
        - Search
      summary: Full fuzzy search
      description: |
        Full fuzzy search using PostgreSQL pg_trgm.
        Supports typo-tolerance and Vietnamese diacritics-insensitive search.
      operationId: searchCourts
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (minimum 2 characters)
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: minSimilarity
          in: query
          description: Minimum similarity threshold (0-1)
          schema:
            type: number
            format: float
            default: 0.3
            minimum: 0
            maximum: 1
        - name: district
          in: query
          description: Filter by district name
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCourtListResponse'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/search/popular:
    get:
      tags:
        - Search
      summary: Get popular searches
      description: Get trending/popular search queries
      operationId: getPopularSearches
      parameters:
        - name: limit
          in: query
          description: Number of results
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Popular searches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopularSearchesResponse'

  /api/admin/search/reindex:
    post:
      tags:
        - Admin
      summary: Rebuild search index
      description: Rebuild the Redis autocomplete index from the database
      operationId: reindexSearch
      responses:
        '200':
          description: Index rebuilt successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResponse'

  /api/admin/search/stats:
    get:
      tags:
        - Admin
      summary: Get search index statistics
      description: Get statistics about the search index
      operationId: getSearchStats
      responses:
        '200':
          description: Search index statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatsResponse'

  /api/bookings:
    get:
      tags:
        - Bookings
      summary: Get bookings by phone
      description: Get all bookings for a phone number
      operationId: getBookingsByPhone
      security: []
      parameters:
        - name: phone
          in: query
          required: true
          description: Phone number
          schema:
            type: string
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'

    post:
      tags:
        - Bookings
      summary: Create a booking
      description: |
        Create a new court booking. Minimum duration is 1 hour, in 30-minute increments.
        
        **Authentication Required**: Requires an authenticated Firebase user (registered or anonymous).
        The `userId` is automatically extracted from the Bearer token and should NOT be provided in the request body.
        
        **Single vs Group Bookings**:
        - **Single booking**: Provide `subCourtId`, `date`, `startTime`, `endTime` directly in the request body.
          Response will be a single booking object.
        - **Group booking**: Provide an array of bookings via the `bookings` field.
          Response will be an array of booking objects.
        
        **Time Validation**:
        - Start time must be before end time
        - Minimum duration: 1 hour (60 minutes)
        - Time increments: 30-minute slots only
        - Format: "HH:mm" (24-hour format)
        
        **Date Format**: "YYYY-MM-DD"
      operationId: createBooking
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            examples:
              singleBooking:
                summary: Single booking example
                value:
                  subCourtId: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                  date: "2025-12-15"
                  startTime: "14:00"
                  endTime: "16:00"
                  guestName: "Nguyễn Văn A"
                  guestPhone: "0912345678"
                  guestEmail: "nguyen.van.a@example.com"
                  notes: "Prefer court near entrance"
              groupBooking:
                summary: Group booking (multiple courts/times)
                value:
