  # ==================== S3 Proxy Endpoints ====================

  /api/s3-proxy/{bucket}/{key}:
    get:
      tags:
        - Images
      summary: Get image from S3 storage
      description: |
        Proxy endpoint for accessing images stored in S3 (LocalStack in development).
        All image URLs returned by the API (profile photos, match images) use this proxy route.
        
        **Development**: Images are stored in LocalStack S3 and proxied through this endpoint.
        **Production**: Images are stored in AWS S3 and proxied through this endpoint.
        
        **URL Format**: `http://localhost:3000/api/s3-proxy/{bucket}/{key}`
        
        **Examples**:
        - Profile photo: `/api/s3-proxy/smatch-photos/users/uuid/profile.jpg`
        - Match image: `/api/s3-proxy/smatch-photos/matches/uuid/image-1.jpg`
        
        **Note**: You don't need to construct these URLs manually. The API automatically returns
        proxied URLs in all responses (user profiles, match listings, etc.).
      operationId: getS3Image
      security: []
      parameters:
        - name: bucket
          in: path
          required: true
          description: S3 bucket name
          schema:
            type: string
            example: smatch-photos
        - name: key
          in: path
          required: true
          description: S3 object key (full path including folders)
          schema:
            type: string
            example: users/123e4567-e89b-12d3-a456-426614174000/profile.jpg
      responses:
        '200':
          description: Image file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: S3 service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== Match (Exchange) Endpoints ====================

  /api/matches:
    get:
      tags:
        - Matches
      summary: List exchange matches
      description: |
        Get paginated list of exchange matches with optional filters.
        Use this to discover matches looking for players.
        
        **⚠️ Important**: If authenticated, the response will automatically **exclude matches you have already joined** (status=ACCEPTED).
        This ensures you only see matches available for you to join.
        
        **Expired Match Filtering**:
        - **Default behavior** (`includeExpired=false` or omitted): Returns only **non-expired matches** where `(date + end_time) > NOW()`
        - **Full history** (`includeExpired=true`): Returns **all matches** including past/expired ones
      operationId: listMatches
      security: []
      parameters:
        - name: courtId
          in: query
          description: Filter by court UUID
          schema:
            type: string
            format: uuid
        - name: skillLevel
          in: query
          description: Filter by skill level
          schema:
            $ref: '#/components/schemas/SkillLevel'
        - name: playerFormat
          in: query
          description: Filter by player format
          schema:
            $ref: '#/components/schemas/PlayerFormat'
        - name: status
          in: query
          description: Filter by match status
          schema:
            $ref: '#/components/schemas/MatchStatus'
        - name: date
          in: query
          description: Filter by specific date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: dateFrom
          in: query
          description: Filter matches from this date
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Filter matches until this date
          schema:
            type: string
            format: date
        - name: includeExpired
          in: query
          description: "Include expired/past matches (default: false)"
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page (max 50)
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: List of matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchListResponse'

    post:
      tags:
        - Matches
      summary: Create an exchange match
      description: |
        Create a new exchange match to find players.
        
        **Authentication Required**: Requires a registered (non-anonymous) user.
        
        **Image Upload Options**:
        1. **Multipart/form-data (Recommended)**: Upload up to 3 images directly with the request
           - Images will be automatically compressed and stored in S3
           - **Requirements**: JPEG, PNG, or WebP format, max 5MB per file
           - Images compressed to max 1920x1080 with JPEG quality 80
        2. **JSON with URLs**: Provide pre-uploaded S3 URLs in the `images` array
        
        **Privacy**: 
        - Public matches (isPrivate: false): Players join immediately
        - Private matches (isPrivate: true): Host must approve join requests
      operationId: createMatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - courtId
                - skillLevel
                - shuttleType
                - playerFormat
                - date
                - startTime
                - endTime
                - price
                - slotsNeeded
              properties:
                courtId:
                  type: string
                  format: uuid
                  description: Court UUID
                title:
                  type: string
                  maxLength: 255
                  description: Match title
                description:
                  type: string
                  description: Detailed match description
                skillLevel:
                  $ref: '#/components/schemas/SkillLevel'
                shuttleType:
                  $ref: '#/components/schemas/ShuttleType'
                playerFormat:
                  $ref: '#/components/schemas/PlayerFormat'
                date:
                  type: string
                  format: date
                  description: Match date (YYYY-MM-DD)
                startTime:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  description: Start time (HH:mm, 24-hour)
                  example: "18:00"
                endTime:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  description: End time (HH:mm, 24-hour)
                  example: "20:00"
                isPrivate:
                  type: boolean
                  default: false
                  description: Whether host approval is required
                price:
                  type: integer
                  minimum: 0
                  description: Price per player in VND
                slotsNeeded:
                  type: integer
                  minimum: 1
                  maximum: 20
                  description: Number of players needed
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 3
                  description: Up to 3 match images (max 5MB each, JPEG/PNG/WebP)
            examples:
              withImages:
                summary: Multipart with image files
                value:
                  courtId: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                  title: "Đánh giao lưu cuối tuần"
                  skillLevel: "TB_PLUS"
                  shuttleType: "TC77"
                  playerFormat: "DOUBLE_MALE"
                  date: "2025-12-28"
                  startTime: "18:00"
                  endTime: "20:00"
                  price: 50000
                  slotsNeeded: 3
                  # images: [binary file 1, binary file 2]
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMatchRequest'
            examples:
              publicMatch:
                summary: Public match example
                value:
                  courtId: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                  title: "Đánh giao lưu cuối tuần"
                  description: "Tìm bạn đánh giao lưu level TB+"
                  skillLevel: "TB_PLUS"
                  shuttleType: "TC77"
                  playerFormat: "DOUBLE_MALE"
                  date: "2025-12-28"
                  startTime: "18:00"
                  endTime: "20:00"
                  isPrivate: false
                  price: 50000
                  slotsNeeded: 3
              privateMatch:
                summary: Private match with approval
                value:
                  courtId: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
                  title: "Tập luyện nghiêm túc"
                  skillLevel: "K"
                  shuttleType: "YONEX_AS40"
                  playerFormat: "MIXED_DOUBLE"
                  date: "2025-12-29"
                  startTime: "19:00"
                  endTime: "21:00"
                  isPrivate: true
                  price: 75000
                  slotsNeeded: 2
      responses:
        '201':
          description: Match created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

